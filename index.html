<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0>
<meta name="description" content="Interactive 3D Solar System Dashboard — real-time physics, procedural audio, live data visualisation. Pure vanilla web tech.">
<meta name="theme-color" content="#06060f">
<meta name="color-scheme" content="dark light">
<title>Solar System Dashboard</title>

<!-- ═══════════════════════════════════════════════════
     CSS — organised with @layer cascade management
     ═══════════════════════════════════════════════════ -->
<style>
/* ── Layer order ─────────────────────────────────── */
@layer reset, base, theme, layout, components, utilities;

/* ── Reset ───────────────────────────────────────── */
@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { overflow: hidden; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  img, svg, canvas { display: block; max-width: 100%; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  ul, ol { list-style: none; }
}

/* ── Base ────────────────────────────────────────── */
@layer base {
  :root {
    --font-xs: clamp(.65rem, 1.2vw, .75rem);
    --font-sm: clamp(.75rem, 1.5vw, .85rem);
    --font-md: clamp(.85rem, 1.8vw, 1rem);
    --font-lg: clamp(1.1rem, 2.2vw, 1.35rem);
    --font-xl: clamp(1.4rem, 3vw, 1.8rem);
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 40px;
    --sidebar-w: 340px;
    --header-h: 52px;
    --transition-fast: 180ms ease;
    --transition-med: 350ms cubic-bezier(.4,0,.2,1);
    --glow-sun: drop-shadow(0 0 30px rgba(253,184,19,.45));
    --z-canvas: 0;
    --z-ui: 10;
    --z-sidebar: 20;
    --z-overlay: 30;
    --z-tooltip: 40;
    --z-modal: 50;
  }

  html, body, #app { width: 100%; height: 100%; }
  #app { position: relative; }

  :focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: 2px;
  }
}

/* ── Theme: Dark (default) ───────────────────────── */
@layer theme {
  [data-theme="dark"] {
    --color-bg: #06060f;
    --color-surface: rgba(12,12,30,.82);
    --color-surface-solid: #0c0c1e;
    --color-border: rgba(80,130,220,.18);
    --color-text: #d4d8e8;
    --color-text-dim: #7a80a0;
    --color-text-bright: #f0f2ff;
    --color-primary: #4fc3f7;
    --color-accent: #fdb813;
    --color-danger: #ef5350;
    --color-success: #66bb6a;
    --color-focus: #4fc3f7;
    --color-chart-1: #4fc3f7;
    --color-chart-2: #ff9800;
    --color-chart-3: #ab47bc;
    --glass-bg: rgba(10,10,30,.72);
    --glass-border: rgba(100,160,255,.12);
    --glass-blur: 18px;
    --scrollbar-track: rgba(255,255,255,.04);
    --scrollbar-thumb: rgba(100,160,255,.18);
  }

  [data-theme="light"] {
    --color-bg: #e8ecf4;
    --color-surface: rgba(255,255,255,.88);
    --color-surface-solid: #ffffff;
    --color-border: rgba(0,0,0,.1);
    --color-text: #1e293b;
    --color-text-dim: #64748b;
    --color-text-bright: #0f172a;
    --color-primary: #1976d2;
    --color-accent: #e65100;
    --color-danger: #c62828;
    --color-success: #2e7d32;
    --color-focus: #1976d2;
    --color-chart-1: #1976d2;
    --color-chart-2: #e65100;
    --color-chart-3: #7b1fa2;
    --glass-bg: rgba(255,255,255,.78);
    --glass-border: rgba(0,0,0,.08);
    --glass-blur: 16px;
    --scrollbar-track: rgba(0,0,0,.04);
    --scrollbar-thumb: rgba(0,0,0,.15);
  }

  [data-theme="high-contrast"] {
    --color-bg: #000000;
    --color-surface: rgba(20,20,20,.95);
    --color-surface-solid: #141414;
    --color-border: rgba(0,255,255,.35);
    --color-text: #ffffff;
    --color-text-dim: #b0b0b0;
    --color-text-bright: #ffffff;
    --color-primary: #00ffff;
    --color-accent: #ffff00;
    --color-danger: #ff4444;
    --color-success: #44ff44;
    --color-focus: #ffff00;
    --color-chart-1: #00ffff;
    --color-chart-2: #ffff00;
    --color-chart-3: #ff44ff;
    --glass-bg: rgba(0,0,0,.92);
    --glass-border: rgba(0,255,255,.4);
    --glass-blur: 0px;
    --scrollbar-track: #111;
    --scrollbar-thumb: #00ffff;
  }
}

/* ── Layout ──────────────────────────────────────── */
@layer layout {
  #bg-canvas, #main-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #bg-canvas   { z-index: var(--z-canvas); }
  #main-canvas { z-index: calc(var(--z-canvas) + 1); }

  #app-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-lg);
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-bottom: 1px solid var(--glass-border);
    z-index: var(--z-ui);
    color: var(--color-text);
  }
  #app-header h1 {
    font-size: var(--font-lg);
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--color-text-bright);
    white-space: nowrap;
  }
  .header-controls {
    display: flex;
    gap: var(--space-sm);
    align-items: center;
  }

  #sidebar {
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-right: 1px solid var(--glass-border);
    z-index: var(--z-sidebar);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform var(--transition-med);
    color: var(--color-text);
  }
  #sidebar.collapsed { transform: translateX(calc(-1 * var(--sidebar-w))); }

  .sidebar-section {
    padding: var(--space-md);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .sidebar-section.charts-section {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  }
  .sidebar-section h2 {
    font-size: var(--font-sm);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--color-text-dim);
    margin-bottom: var(--space-sm);
  }

  #planet-info-panel {
    position: fixed;
    top: var(--header-h);
    right: 0;
    bottom: 0;
    width: 380px;
    max-width: 100vw;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-left: 1px solid var(--glass-border);
    z-index: var(--z-overlay);
    transform: translateX(100%);
    transition: transform var(--transition-med);
    overflow-y: auto;
    color: var(--color-text);
    padding: var(--space-lg);
  }
  #planet-info-panel.open { transform: translateX(0); }

  #tooltip {
    position: fixed;
    z-index: var(--z-tooltip);
    background: var(--color-surface-solid);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: var(--space-xs) var(--space-sm);
    font-size: var(--font-xs);
    pointer-events: none;
    opacity: 0;
    transition: opacity 150ms ease;
    white-space: nowrap;
  }
  #tooltip.visible { opacity: 1; }

  /* Time controls bar */
  #time-controls {
    position: fixed;
    bottom: var(--space-lg);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: var(--space-sm);
    align-items: center;
    padding: var(--space-sm) var(--space-md);
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    z-index: var(--z-ui);
    color: var(--color-text);
  }

  /* Loading overlay */
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--color-bg);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--color-text);
    transition: opacity .6s ease;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 60px; height: 60px;
    border: 3px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: var(--space-md);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 768px) {
    #sidebar {
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 55vh;
      border-right: none;
      border-top: 1px solid var(--glass-border);
      transform: translateY(calc(100% - 48px));
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    #sidebar.collapsed { transform: translateY(100%); }
    #sidebar.expanded { transform: translateY(0); }
    .sidebar-pull-tab {
      display: flex !important;
      justify-content: center;
      padding: var(--space-sm);
      cursor: grab;
    }
    .sidebar-pull-tab::after {
      content: '';
      width: 36px;
      height: 4px;
      background: var(--color-text-dim);
      border-radius: 2px;
    }
    #planet-info-panel {
      top: auto;
      bottom: 0;
      width: 100%;
      max-height: 70vh;
      border-left: none;
      border-top: 1px solid var(--glass-border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: translateY(100%);
    }
    #planet-info-panel.open { transform: translateY(0); }
    #time-controls { bottom: 60px; }
  }
}

/* ── Components ──────────────────────────────────── */
@layer components {
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-text);
    font-size: var(--font-xs);
    cursor: pointer;
    transition: all var(--transition-fast);
    min-width: 32px;
    min-height: 32px;
    user-select: none;
  }
  .btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .btn:active { transform: scale(.96); }
  .btn.active { background: var(--color-primary); color: var(--color-bg); border-color: var(--color-primary); }

  .icon-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all var(--transition-fast);
  }
  .icon-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }

  .planet-list-item {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background var(--transition-fast);
    font-size: var(--font-sm);
  }
  .planet-list-item:hover { background: rgba(79,195,247,.08); }
  .planet-list-item.active { background: rgba(79,195,247,.14); color: var(--color-primary); }
  .planet-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Chart containers */
  .chart-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    margin-bottom: var(--space-md);
    container-type: inline-size;
    container-name: chart;
  }
  .chart-card h3 {
    font-size: var(--font-xs);
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--color-text-dim);
    margin-bottom: var(--space-sm);
  }
  .chart-svg {
    width: 100%;
    height: 120px;
  }
  @container chart (max-width: 250px) {
    .chart-svg { height: 80px; }
  }

  /* Planet info card */
  .info-header {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .info-planet-orb {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .info-name {
    font-size: var(--font-xl);
    font-weight: 700;
    color: var(--color-text-bright);
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-sm);
    font-size: var(--font-sm);
  }
  .info-label {
    color: var(--color-text-dim);
  }
  .info-value {
    color: var(--color-text-bright);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* Speed display */
  .speed-display {
    font-variant-numeric: tabular-nums;
    font-size: var(--font-sm);
    color: var(--color-primary);
    min-width: 60px;
    text-align: center;
  }

  /* Range slider */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 4px;
    background: var(--color-border);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--color-primary);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--color-primary);
    cursor: pointer;
    border: none;
  }

  /* Screen reader only */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  /* Audio toggle */
  .audio-indicator {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
  }
  .audio-bar {
    width: 3px;
    background: var(--color-primary);
    border-radius: 1px;
    transition: height .2s ease;
  }
  .audio-indicator.muted .audio-bar { height: 2px !important; opacity: .3; }
}

/* ── Utilities ───────────────────────────────────── */
@layer utilities {
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn .4s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .loader-ring { animation: none; border-color: var(--color-primary); }
  }
}
</style>
</head>

<body data-theme="dark">
<div id="app">

  <!-- Background canvas (OffscreenCanvas worker) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Main Three.js canvas -->
  <canvas id="main-canvas" role="img" aria-label="Interactive 3D solar system visualisation. Use mouse to rotate, scroll to zoom, click planets for details."></canvas>

  <!-- Loading overlay -->
  <div id="loading-overlay" role="alert" aria-live="polite">
    <div class="loader-ring" aria-hidden="true"></div>
    <p style="font-size:var(--font-sm);color:var(--color-text-dim);">Initialising solar system&hellip;</p>
  </div>

  <!-- Header -->
  <header id="app-header" role="banner">
    <div style="display:flex;align-items:center;gap:var(--space-sm);">
      <button class="icon-btn" id="btn-sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">&#9776;</button>
      <h1>Solar System</h1>
    </div>
    <div class="header-controls">
      <button class="icon-btn" id="btn-audio-toggle" aria-label="Toggle audio" title="Toggle audio">
        <span class="audio-indicator" id="audio-indicator">
          <span class="audio-bar" style="height:4px"></span>
          <span class="audio-bar" style="height:10px"></span>
          <span class="audio-bar" style="height:7px"></span>
          <span class="audio-bar" style="height:12px"></span>
        </span>
      </button>
      <button class="icon-btn" id="btn-theme" aria-label="Switch theme" title="Switch theme">&#9681;</button>
      <button class="icon-btn" id="btn-fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">&#x26F6;</button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar" role="complementary" aria-label="Solar system controls and data">
    <div class="sidebar-pull-tab" style="display:none;" aria-hidden="true"></div>

    <!-- Planet list -->
    <nav class="sidebar-section" aria-label="Planet navigation">
      <h2>Planets</h2>
      <ul id="planet-list" role="list"></ul>
    </nav>

    <!-- Charts -->
    <div class="sidebar-section charts-section">
      <h2>Live Data</h2>

      <div class="chart-card">
        <h3>Orbital Velocity (km/s)</h3>
        <svg class="chart-svg" id="chart-velocity" viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="Bar chart of planet orbital velocities"></svg>
      </div>

      <div class="chart-card">
        <h3>Distance from Sun (AU)</h3>
        <svg class="chart-svg" id="chart-distance" viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="Line chart of planet distances from the Sun over time"></svg>
      </div>

      <div class="chart-card">
        <h3>Gravitational Force (N, log)</h3>
        <svg class="chart-svg" id="chart-gravity" viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="Chart of gravitational force on each planet"></svg>
      </div>
    </div>

    <!-- Simulation controls in sidebar -->
    <div class="sidebar-section" style="padding-top:var(--space-sm)">
      <h2>Simulation</h2>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm);font-size:var(--font-xs);">
        <label style="display:flex;align-items:center;gap:var(--space-sm);">
          <input type="checkbox" id="chk-orbits" checked> Show orbits
        </label>
        <label style="display:flex;align-items:center;gap:var(--space-sm);">
          <input type="checkbox" id="chk-labels" checked> Show labels
        </label>
        <label style="display:flex;align-items:center;gap:var(--space-sm);">
          <input type="checkbox" id="chk-trails"> Show trails
        </label>
      </div>
    </div>
  </aside>

  <!-- Planet info panel (right side) -->
  <section id="planet-info-panel" role="dialog" aria-label="Planet details" aria-hidden="true">
    <button class="icon-btn" id="btn-close-info" aria-label="Close panel" style="position:absolute;top:var(--space-md);right:var(--space-md);">&#10005;</button>
    <div id="planet-info-content"></div>
  </section>

  <!-- Tooltip -->
  <div id="tooltip" role="tooltip" aria-hidden="true"></div>

  <!-- Time controls (bottom bar) -->
  <div id="time-controls" role="toolbar" aria-label="Simulation time controls">
    <button class="btn" id="btn-slower" aria-label="Slow down">&#x23EA;</button>
    <button class="btn" id="btn-pause" aria-label="Pause simulation">&#x23F8;</button>
    <button class="btn" id="btn-faster" aria-label="Speed up">&#x23E9;</button>
    <span class="speed-display" id="speed-display" aria-live="polite">1.0x</span>
    <input type="range" id="range-speed" min="-2" max="4" step="0.1" value="0" aria-label="Simulation speed">
    <button class="btn" id="btn-reset-view" aria-label="Reset camera view">&#x1F3E0;</button>
  </div>

  <!-- Skip to content for a11y -->
  <a href="#main-canvas" class="sr-only" style="position:fixed;top:0;left:0;z-index:9999;background:var(--color-primary);color:#000;padding:8px 16px;">Skip to 3D view</a>

</div><!-- /app -->

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",

  }
}
</script>

<!-- ═══════════════════════════════════════════════════
     MAIN APPLICATION MODULE
     ═══════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ╔═══════════════════════════════════════════════════╗
   ║  1. CONSTANTS & PLANET DATA                       ║
   ╚═══════════════════════════════════════════════════╝ */

/** Gravitational constant (scaled for simulation) */
const G = 6.674e-3;

/** Scale factors */
const AU = 50;          // 1 AU in scene units
const SIZE_SCALE = 0.6; // planet radius multiplier
const SUN_RADIUS = 4;

/**

/* ╔═══════════════════════════════════════════════════╗
   ║  2. EVENT BUS                                     ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Simple pub/sub event bus for decoupled component communication.
 * @namespace EventBus
 */
const EventBus = (() => {
  /** @type {Map<string, Set<Function>>} */
  const listeners = new Map();

  return {
    /**
     * Subscribe to an event.
     * @param {string} event - Event name
     * @param {Function} fn  - Callback
     * @returns {Function} Unsubscribe function
     */
    on(event, fn) {
      if (!listeners.has(event)) listeners.set(event, new Set());
      listeners.get(event).add(fn);
      return () => listeners.get(event)?.delete(fn);
    },

    /**
     * Emit an event with optional data.
     * @param {string} event - Event name
     * @param {*} [data]     - Payload
     */
    emit(event, data) {
      listeners.get(event)?.forEach(fn => {
        try { fn(data); } catch (e) { console.error(`[EventBus] Error in "${event}" handler:`, e); }
      });
    },

    /**
     * Subscribe once, then auto-unsubscribe.
     * @param {string} event
     * @param {Function} fn
     */
    once(event, fn) {
      const unsub = EventBus.on(event, (data) => { unsub(); fn(data); });
    }
  };
})();

   ║  3. REACTIVE STATE (Proxy-based)                  ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Creates a deeply reactive state object.
 * Changes automatically emit events on the EventBus.
 * @param {Object} initial - Initial state shape
 * @param {string} [namespace='state'] - EventBus namespace prefix
 * @returns {Object} Proxied reactive state
 */
function createReactiveState(initial, namespace = 'state') {
  /**
   * Wraps value in a reactive proxy recursively.
   * @param {*} obj
   * @param {string} path
   * @returns {*}
   */
  function makeReactive(obj, path) {
    if (obj === null || typeof obj !== 'object') return obj;
    return new Proxy(obj, {
      set(target, prop, value) {
        const old = target[prop];
        if (old === value) return true;
        target[prop] = value;
        const fullPath = path ? `${path}.${String(prop)}` : String(prop);
        EventBus.emit(`${namespace}:${fullPath}`, { value, old, path: fullPath });
        EventBus.emit(`${namespace}:change`, { path: fullPath, value, old });
        return true;
      },
      get(target, prop) {
        const val = target[prop];
        if (typeof val === 'object' && val !== null && typeof prop === 'string') {
          return makeReactive(val, path ? `${path}.${prop}` : prop);
        }
        return val;
      }
    });
  }
  return makeReactive(initial, '');
}

/* ╔═══════════════════════════════════════════════════╗
   ║  4. ROUTER (hash-based with deep links)           ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Minimal hash-based router.
 * Supports routes: /, /planet/:name, /settings
 * @namespace Router
 */
const Router = (() => {
  /** @type {Array<{pattern:RegExp, handler:Function}>} */
  const routes = [];

  /**
   * Register a route.
   * @param {string} path   - Route pattern (e.g. '/planet/:name')
   * @param {Function} handler - Called with matched params
   */
  function addRoute(path, handler) {
    const paramNames = [];
    const regexStr = path.replace(/:([^/]+)/g, (_, name) => {
      paramNames.push(name);
      return '([^/]+)';
    });
    routes.push({ pattern: new RegExp(`^${regexStr}$`), handler, paramNames });
  }

  /**
   * Navigate to a path (updates hash).
   * @param {string} path
   */
  function navigate(path) {
    if (window.location.hash === `#${path}`) {
      resolve(path);
    } else {
      window.location.hash = path;
    }
  }

  /**
   * Resolve a path against registered routes.
   * @param {string} path
   */
  function resolve(path) {
    for (const route of routes) {
      const match = path.match(route.pattern);
      if (match) {
        const params = {};
        route.paramNames?.forEach((name, i) => { params[name] = match[i + 1]; });
        try { route.handler(params); } catch (e) { console.error('[Router]', e); }
        state.route = path;
        EventBus.emit('route:change', { path, params });
        return;
      }
    }
    // Fallback: home
    try { routes[0]?.handler({}); } catch (e) { console.error('[Router]', e); }
    state.route = '/';
  }

  /** Initialise the router (listen to hashchange). */
  function init() {
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1) || '/';
      resolve(hash);
    });
    const initial = window.location.hash.slice(1) || '/';
    resolve(initial);
  }

  return { addRoute, navigate, init };
})();


/* ╔═══════════════════════════════════════════════════╗
   ║  5. PHYSICS WEB WORKER (inline via Blob URL)      ║
   ╚═══════════════════════════════════════════════════╝ */

/** Physics worker source code as a string. */
const PHYSICS_WORKER_SRC = /* js */ `
"use strict";

const G = 6.674e-3;
const AU = 50;
const DT_BASE = 0.016; // ~60fps base timestep
let bodies = [];
let running = true;

/**
 * Initialise bodies from planet data.
 * @param {Array} planets - Planet config array
 * @param {{mass:number}} sun - Sun config
 */
function initBodies(planets, sun) {
  bodies = [];
  // Sun at origin, stationary
  bodies.push({
    name: 'Sun',
    mass: sun.mass,
    x: 0, y: 0, z: 0,
    vx: 0, vy: 0, vz: 0,
    ax: 0, ay: 0, az: 0
  });
  for (const p of planets) {
    const r = p.distance * AU;
    const angle = Math.random() * Math.PI * 2;
    // Circular orbital velocity: v = sqrt(G * M_sun / r)
    const v = Math.sqrt(G * sun.mass / r);
    // Apply eccentricity perturbation
    const eccFactor = 1.0 + (Math.random() - 0.5) * p.eccentricity;
    bodies.push({
      name: p.name,
      mass: p.mass,
      x: Math.cos(angle) * r * eccFactor,
      y: (Math.random() - 0.5) * r * 0.02 * Math.tan(p.inclination * Math.PI / 180),
      z: Math.sin(angle) * r * eccFactor,
      vx: -Math.sin(angle) * v,
      vy: 0,
      vz: Math.cos(angle) * v,
      ax: 0, ay: 0, az: 0
    });
  }
}

/**
 * Compute gravitational accelerations for all bodies.
 * Uses Newtonian gravity: F = G*m1*m2/r^2
 */
function computeForces() {
  const n = bodies.length;
  for (let i = 0; i < n; i++) {
    bodies[i].ax = 0;
    bodies[i].ay = 0;
    bodies[i].az = 0;
  }
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const bi = bodies[i];
      const bj = bodies[j];
      const dx = bj.x - bi.x;
      const dy = bj.y - bi.y;
      const dz = bj.z - bi.z;
      const distSq = dx * dx + dy * dy + dz * dz;
      const dist = Math.sqrt(distSq);
      // Softening to prevent singularities
      const softDist = Math.max(dist, 0.5);
      const forceMag = G * bi.mass * bj.mass / (softDist * softDist);
      const fx = forceMag * dx / softDist;
      const fy = forceMag * dy / softDist;
      const fz = forceMag * dz / softDist;
      // a = F / m
      bi.ax += fx / bi.mass;
      bi.ay += fy / bi.mass;
      bi.az += fz / bi.mass;
      bj.ax -= fx / bj.mass;
      bj.ay -= fy / bj.mass;
      bj.az -= fz / bj.mass;
    }
  }
}

/**
 * Advance simulation using Velocity Verlet integration.
 * @param {number} dt - Time step
 */
function step(dt) {
  const n = bodies.length;
  // Half-step velocity + full-step position
  for (let i = 1; i < n; i++) { // skip sun (i=0) to keep it fixed
    const b = bodies[i];
    b.vx += b.ax * dt * 0.5;
    b.vy += b.ay * dt * 0.5;
    b.vz += b.az * dt * 0.5;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
  }
  // New forces
  computeForces();
  // Complete velocity step
  for (let i = 1; i < n; i++) {
    const b = bodies[i];
    b.vx += b.ax * dt * 0.5;
    b.vy += b.ay * dt * 0.5;
    b.vz += b.az * dt * 0.5;
  }
}

/**
 * Run physics at fixed timestep and send results.
 * @param {number} timeScale
 */
function tick(timeScale) {
  if (!running) return;
  const dt = DT_BASE * timeScale;
  const substeps = Math.min(Math.ceil(Math.abs(timeScale)), 8);
  const subDt = dt / substeps;
  for (let s = 0; s < substeps; s++) {
    step(subDt);
  }
  // Pack positions and velocities (skip sun at index 0)
  const n = bodies.length - 1;
  const positions = new Float64Array(n * 3);
  const velocities = new Float64Array(n * 3);
  const forces = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const b = bodies[i + 1]; // skip sun
    positions[i * 3]     = b.x;
    positions[i * 3 + 1] = b.y;
    positions[i * 3 + 2] = b.z;
    velocities[i * 3]     = b.vx;
    velocities[i * 3 + 1] = b.vy;
    velocities[i * 3 + 2] = b.vz;
    // Gravitational force magnitude from sun
    const dx = b.x - bodies[0].x;
    const dy = b.y - bodies[0].y;
    const dz = b.z - bodies[0].z;
    const r = Math.sqrt(dx*dx + dy*dy + dz*dz);
    forces[i] = G * bodies[0].mass * b.mass / (r * r);
  }
  self.postMessage(
    { type: 'update', positions, velocities, forces, dt },
    [positions.buffer, velocities.buffer, forces.buffer]
  );
}

self.onmessage = (e) => {
  const { type, planets, sun, timeScale } = e.data;
  switch (type) {
    case 'init':
      initBodies(planets, sun);
      computeForces();
      // Send initial positions
      tick(1);
      break;
    case 'tick':
      tick(timeScale);
      break;
    case 'pause':
      running = false;
      break;
    case 'resume':
      running = true;
      break;
  }
};
`;

/** @type {Worker|null} */
let physicsWorker = null;

/**
 * Initialise the physics Web Worker.
 * @returns {Worker}
 */
function initPhysicsWorker() {
  try {
    const blob = new Blob([PHYSICS_WORKER_SRC], { type: 'application/javascript' });
    physicsWorker = new Worker(URL.createObjectURL(blob));

    physicsWorker.postMessage({
      type: 'init',
      planets: PLANETS.map(p => ({
        name: p.name, mass: p.mass, distance: p.distance,
        eccentricity: p.eccentricity, inclination: p.inclination
      })),
      sun: { mass: SUN.mass }
    });

    physicsWorker.onmessage = (e) => {
      if (e.data.type === 'update') {
        const { positions, velocities, forces, dt } = e.data;
        for (let i = 0; i < PLANETS.length; i++) {
          state.positions[i] = [
            positions[i * 3],
            positions[i * 3 + 1],
            positions[i * 3 + 2]
          ];
          state.velocities[i] = [
            velocities[i * 3],
            velocities[i * 3 + 1],
            velocities[i * 3 + 2]
          ];
        }
        EventBus.emit('physics:update', { positions, velocities, forces, dt });
      }
    };

    physicsWorker.onerror = (e) => {
      console.error('[PhysicsWorker] Error:', e.message);
    };

    return physicsWorker;
  } catch (err) {
    console.error('[PhysicsWorker] Failed to create worker:', err);
    return null;
  }
}


/* ╔═══════════════════════════════════════════════════╗
   ║  6. OFFSCREEN CANVAS BACKGROUND WORKER            ║
   ╚═══════════════════════════════════════════════════╝ */

const BG_WORKER_SRC = /* js */ `
"use strict";

let canvas = null;
let ctx = null;
let stars = [];
let mouseX = 0;
let mouseY = 0;
let width = 0;
let height = 0;
let animId = null;

/**
 * Create star field.
 * @param {number} count
 */
function createStars(count) {
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      z: Math.random() * 3 + 0.2,          // depth (parallax factor)
      size: Math.random() * 1.8 + 0.3,
      brightness: Math.random() * 0.6 + 0.4,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2,
      hue: Math.random() > 0.85 ? Math.floor(Math.random() * 60 + 200) : 0 // some blue-ish stars
    });
  }
}

let time = 0;

/**
 * Render star field with parallax.
 */
function render() {
  if (!ctx) return;
  time += 0.016;
  ctx.fillStyle = 'rgba(6,6,15,1)';
  ctx.fillRect(0, 0, width, height);

  // Subtle nebula glow
  const grd = ctx.createRadialGradient(
    width * 0.3 + mouseX * 0.02, height * 0.4 + mouseY * 0.02, 0,
    width * 0.3, height * 0.4, width * 0.5
  );
  grd.addColorStop(0, 'rgba(30,10,60,0.08)');
  grd.addColorStop(0.5, 'rgba(10,20,60,0.04)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, width, height);

  // Second nebula
  const grd2 = ctx.createRadialGradient(
    width * 0.7 - mouseX * 0.015, height * 0.6 - mouseY * 0.015, 0,
    width * 0.7, height * 0.6, width * 0.4
  );
  grd2.addColorStop(0, 'rgba(60,15,20,0.06)');
  grd2.addColorStop(1, 'transparent');
  ctx.fillStyle = grd2;
  ctx.fillRect(0, 0, width, height);

  for (const star of stars) {
    const twinkle = Math.sin(time * star.twinkleSpeed * 60 + star.twinklePhase) * 0.3 + 0.7;
    const alpha = star.brightness * twinkle;
    const px = ((star.x + mouseX * star.z * 0.03) % width + width) % width;
    const py = ((star.y + mouseY * star.z * 0.03) % height + height) % height;

    if (star.hue > 0) {
      ctx.fillStyle = 'hsla(' + star.hue + ',60%,75%,' + alpha + ')';
    } else {
      ctx.fillStyle = 'rgba(220,225,255,' + alpha + ')';
    }

    ctx.beginPath();
    ctx.arc(px, py, star.size, 0, Math.PI * 2);
    ctx.fill();

    // Glow for bright stars
    if (star.size > 1.2) {
      ctx.globalAlpha = alpha * 0.15;
      ctx.beginPath();
      ctx.arc(px, py, star.size * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  animId = requestAnimationFrame(render);
}

self.onmessage = (e) => {
  const { type } = e.data;
  if (type === 'init') {
    canvas = e.data.canvas;
    ctx = canvas.getContext('2d');
    width = e.data.width;
    height = e.data.height;
    canvas.width = width;
    canvas.height = height;
    createStars(Math.min(Math.floor(width * height / 800), 2500));
    render();
  } else if (type === 'resize') {
    width = e.data.width;
    height = e.data.height;
    if (canvas) {
      canvas.width = width;
      canvas.height = height;
    }
    createStars(Math.min(Math.floor(width * height / 800), 2500));
  } else if (type === 'mouse') {
    mouseX = e.data.x;
    mouseY = e.data.y;
  }
};
`;

/** @type {Worker|null} */
let bgWorker = null;

/**
 * Initialise the background star-field worker with OffscreenCanvas.

function initBackgroundWorker() {

    ctx.fillStyle = '#06060f';
    ctx.fillRect(0, 0, w, h);
    const count = Math.min(Math.floor(w * h / 1000), 1500);
    for (let i = 0; i < count; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;
      const size = Math.random() * 1.5 + 0.2;
      const alpha = Math.random() * 0.6 + 0.3;
      ctx.fillStyle = `rgba(220,225,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  draw(window.innerWidth, window.innerHeight);
  window.addEventListener('resize', () => draw(window.innerWidth, window.innerHeight));
}


/* ╔═══════════════════════════════════════════════════╗
   ║  7. AUDIO ENGINE (Web Audio API)                  ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Procedural ambient space audio engine.
 * Each planet has a tone based on its mass; the simulation speed modulates playback.
 * @namespace AudioEngine
 */
const AudioEngine = (() => {
  /** @type {AudioContext|null} */
  let audioCtx = null;
  /** @type {GainNode|null} */
  let masterGain = null;
  /** @type {Array<{osc:OscillatorNode, gain:GainNode}>} */
  let planetOscillators = [];
  /** @type {{osc:OscillatorNode, gain:GainNode}|null} */
  let sunDrone = null;
  /** @type {BiquadFilterNode|null} */
  let lpFilter = null;
  /** @type {DelayNode|null} */
  let reverbDelay = null;
  /** @type {GainNode|null} */
  let reverbFeedback = null;
  let isPlaying = false;
  /** @type {GainNode|null} */
  let reverbGain = null;

  /**
   * Initialise the audio context and all oscillators.
   */
  function init() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Master gain
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;

      // Low pass filter for warmth
      lpFilter = audioCtx.createBiquadFilter();
      lpFilter.type = 'lowpass';
      lpFilter.frequency.value = 2000;
      lpFilter.Q.value = 0.7;

      // Simple delay reverb
      reverbDelay = audioCtx.createDelay(2.0);
      reverbDelay.delayTime.value = 0.8;
      reverbFeedback = audioCtx.createGain();
      reverbFeedback.gain.value = 0.3;
      reverbGain = audioCtx.createGain();
      reverbGain.gain.value = 0.2;

      // Reverb routing: delay -> feedback -> delay (loop), delay -> reverbGain -> master
      reverbDelay.connect(reverbFeedback);
      reverbFeedback.connect(reverbDelay);
      reverbDelay.connect(reverbGain);
      reverbGain.connect(lpFilter);

      masterGain.connect(lpFilter);
      lpFilter.connect(audioCtx.destination);

      // Sun drone — deep triangle wave
      const sunOsc = audioCtx.createOscillator();
      sunOsc.type = 'triangle';
      sunOsc.frequency.value = 55; // A1
      const sunGain = audioCtx.createGain();
      sunGain.gain.value = 0.06;
      sunOsc.connect(sunGain);
      sunGain.connect(masterGain);
      sunGain.connect(reverbDelay);
      sunOsc.start();
      sunDrone = { osc: sunOsc, gain: sunGain };

      // Sub bass
      const subOsc = audioCtx.createOscillator();
      subOsc.type = 'sine';
      subOsc.frequency.value = 32; // deep sub
      const subGain = audioCtx.createGain();
      subGain.gain.value = 0.04;
      subOsc.connect(subGain);
      subGain.connect(masterGain);
      subOsc.start();

      // Planet oscillators
      planetOscillators = PLANETS.map((planet, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.value = planet.audioFreq;

        const gain = audioCtx.createGain();
        // Volume based on distance (closer = louder, but all quiet)
        gain.gain.value = 0.012 / (planet.distance + 0.5);

        osc.connect(gain);
        gain.connect(masterGain);
        gain.connect(reverbDelay);
        osc.start();
        return { osc, gain };
      });

      // LFO for subtle modulation
      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.1;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 3;
      lfo.connect(lfoGain);
      lfoGain.connect(lpFilter.frequency);
      lfo.start();

    } catch (err) {
      console.error('[AudioEngine] Failed to initialise:', err);
    }
  }

  /**
   * Start audio playback.
   */
  function start() {
    if (!audioCtx) init();
    if (audioCtx?.state === 'suspended') {
      audioCtx.resume();
    }
    masterGain?.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 1.5);
    isPlaying = true;
  }

  /**
   * Stop audio playback.
   */
  function stop() {
    masterGain?.gain.linearRampToValueAtTime(0, audioCtx?.currentTime + 0.5);
    isPlaying = false;
  }

  /**
   * Update audio parameters based on simulation state.
   * @param {number} timeScale - Current simulation time scale
   * @param {Float64Array} [velocities] - Planet velocities
   */
  function update(timeScale, velocities) {
    if (!audioCtx || !isPlaying) return;
    try {
      // Adjust filter based on time scale
      const targetFreq = 800 + Math.abs(timeScale) * 400;
      lpFilter.frequency.linearRampToValueAtTime(
        Math.min(targetFreq, 4000),
        audioCtx.currentTime + 0.1
      );

      // Adjust reverb based on speed
      if (reverbDelay) {
        reverbDelay.delayTime.linearRampToValueAtTime(
          0.4 + (1.0 / (Math.abs(timeScale) + 1)) * 0.6,
          audioCtx.currentTime + 0.2
        );
      }

      // Adjust planet oscillator volumes based on velocity
      if (velocities) {
        for (let i = 0; i < PLANETS.length; i++) {
          const vx = velocities[i * 3] || 0;
          const vy = velocities[i * 3 + 1] || 0;
          const vz = velocities[i * 3 + 2] || 0;
          const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
          const baseVol = 0.012 / (PLANETS[i].distance + 0.5);
          const vol = baseVol * (0.5 + speed * 0.08);
          planetOscillators[i]?.gain.gain.linearRampToValueAtTime(
            Math.min(vol, 0.06),
            audioCtx.currentTime + 0.1
          );
        }
      }
    } catch (err) {
      // Audio updates are non-critical
    }
  }

  return { init, start, stop, update, get isPlaying() { return isPlaying; } };
})();


/* ╔═══════════════════════════════════════════════════╗
   ║  8. THREE.JS SCENE MANAGER                       ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Manages the 3D scene: sun, planets, orbits, lighting, raycasting.
 * @namespace SceneManager
 */
const SceneManager = (() => {
  /** @type {THREE.Scene} */
  let scene;
  /** @type {THREE.PerspectiveCamera} */
  let camera;
  /** @type {THREE.WebGLRenderer} */
  let renderer;
  /** @type {OrbitControls} */
  let controls;
  /** @type {THREE.Raycaster} */
  const raycaster = new THREE.Raycaster();
  /** @type {THREE.Vector2} */
  const mouse = new THREE.Vector2();
  /** @type {THREE.Mesh} */
  let sunMesh;
  /** @type {THREE.Mesh[]} */
  const planetMeshes = [];
  /** @type {THREE.Sprite} */
  let sunGlow;
  /** @type {THREE.Line[]} */
  const orbitLines = [];
  /** @type {Map<string, THREE.Sprite>} */
  const labelSprites = new Map();
  /** @type {THREE.Points} */
  let starField;
  /** @type {string|null} */
  let hoveredPlanet = null;
  /** Trail lines per planet */
  const trailLines = [];
  /** Trail position history */
  const trailHistory = PLANETS.map(() => []);
  const MAX_TRAIL_POINTS = 500;
  /** @type {boolean} */
  let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /**
   * Generate a procedural planet texture on a canvas.
   * @param {number} color - Hex colour
   * @param {number} [size=256] - Texture resolution
   * @returns {THREE.CanvasTexture}
   */
  function generatePlanetTexture(color, size = 256) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    const r = (color >> 16) & 0xff;
    const g = (color >> 8) & 0xff;
    const b = color & 0xff;

    // Base colour
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, 0, size, size);

    // Noise texture for surface detail
    const imgData = ctx.getImageData(0, 0, size, size);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const noise = (Math.random() - 0.5) * 40;
      data[i] = Math.max(0, Math.min(255, data[i] + noise));
      data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
      data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
    }
    ctx.putImageData(imgData, 0, 0);

    // Latitude bands (like Jupiter/Saturn)
    if (color === 0xC88B3A || color === 0xE0C080) {
      for (let y = 0; y < size; y += 8 + Math.random() * 12) {
        ctx.fillStyle = `rgba(${r + 30},${g - 20},${b - 10},${Math.random() * 0.2 + 0.05})`;
        ctx.fillRect(0, y, size, 4 + Math.random() * 6);
      }
    }

    // Polar caps for Earth/Mars
    if (color === 0x4B7BE5 || color === 0xC1440E) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.ellipse(size / 2, 10, size / 2, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(size / 2, size - 10, size / 2, 20, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  /**
   * Generate the sun emissive texture.
   * @returns {THREE.CanvasTexture}
   */
  function generateSunTexture() {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, '#fffbe0');
    grad.addColorStop(0.3, '#fdb813');
    grad.addColorStop(0.7, '#e88a00');
    grad.addColorStop(1, '#c05000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);

    // Noise
    const imgData = ctx.getImageData(0, 0, size, size);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const noise = (Math.random() - 0.5) * 25;
      data[i] = Math.max(0, Math.min(255, data[i] + noise));
      data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise * 0.5));
    }
    ctx.putImageData(imgData, 0, 0);

    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  /**
   * Create a text sprite for planet labels.
   * @param {string} text
   * @param {string} color
   * @returns {THREE.Sprite}
   */
  function createTextSprite(text, color) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 256;
    canvas.height = 64;
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 32);

    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(8, 2, 1);
    return sprite;
  }

  /**
   * Initialise the Three.js scene.
   */
  function init() {
    const canvas = document.getElementById('main-canvas');

    // Scene
    scene = new THREE.Scene();

    // Camera
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(30, 45, 80);

    // Renderer
    renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    // Controls
    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 5;
    controls.maxDistance = 400;
    controls.enablePan = true;
    controls.autoRotate = false;
    controls.target.set(0, 0, 0);

    // ── Lighting ────────────────────
    // Sunlight (point light at origin)
    const sunLight = new THREE.PointLight(0xfff5e0, 2.5, 0, 1.5);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    // Subtle ambient
    const ambientLight = new THREE.AmbientLight(0x1a1a3a, 0.3);
    scene.add(ambientLight);

    // ── Sun ─────────────────────────
    const sunGeo = new THREE.SphereGeometry(SUN_RADIUS, 64, 64);
    const sunMat = new THREE.MeshBasicMaterial({
      map: generateSunTexture(),
      color: 0xffffff
    });
    sunMesh = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sunMesh);

    // Sun glow sprite
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 256;
    glowCanvas.height = 256;
    const glowCtx = glowCanvas.getContext('2d');
    const grad = glowCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(253,184,19,0.6)');
    grad.addColorStop(0.2, 'rgba(253,184,19,0.3)');
    grad.addColorStop(0.5, 'rgba(253,140,19,0.1)');
    grad.addColorStop(1, 'rgba(253,184,19,0)');
    glowCtx.fillStyle = grad;
    glowCtx.fillRect(0, 0, 256, 256);
    const glowTex = new THREE.CanvasTexture(glowCanvas);
    const glowMat = new THREE.SpriteMaterial({
      map: glowTex,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    sunGlow = new THREE.Sprite(glowMat);
    sunGlow.scale.set(SUN_RADIUS * 6, SUN_RADIUS * 6, 1);
    scene.add(sunGlow);

    // ── Planets ─────────────────────
    for (let i = 0; i < PLANETS.length; i++) {
      const p = PLANETS[i];
      const visualRadius = Math.max(Math.log(p.radius + 1) * SIZE_SCALE + 0.3, 0.35);
      const geo = new THREE.SphereGeometry(visualRadius, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        map: generatePlanetTexture(p.color),
        roughness: 0.7,
        metalness: 0.1
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData = { planetIndex: i, name: p.name };
      scene.add(mesh);
      planetMeshes.push(mesh);

      // Saturn ring
      if (p.name === 'Saturn') {
        const ringGeo = new THREE.RingGeometry(visualRadius * 1.4, visualRadius * 2.4, 64);
        const ringCanvas = document.createElement('canvas');
        ringCanvas.width = 256;
        ringCanvas.height = 1;
        const ringCtx = ringCanvas.getContext('2d');
        const ringGrad = ringCtx.createLinearGradient(0, 0, 256, 0);
        ringGrad.addColorStop(0, 'rgba(200,180,140,0.01)');
        ringGrad.addColorStop(0.2, 'rgba(210,190,150,0.5)');
        ringGrad.addColorStop(0.4, 'rgba(190,170,130,0.3)');
        ringGrad.addColorStop(0.6, 'rgba(210,190,150,0.5)');
        ringGrad.addColorStop(0.8, 'rgba(200,180,140,0.3)');
        ringGrad.addColorStop(1, 'rgba(200,180,140,0.01)');
        ringCtx.fillStyle = ringGrad;
        ringCtx.fillRect(0, 0, 256, 1);
        const ringTex = new THREE.CanvasTexture(ringCanvas);
        const ringMat = new THREE.MeshBasicMaterial({
          map: ringTex,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.7,
          depthWrite: false
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2 + (p.tilt * Math.PI / 180) * 0.3;
        mesh.add(ring);
      }

      // Orbit line
      const orbitPoints = [];
      const r = p.distance * AU;
      const segments = 128;
      for (let s = 0; s <= segments; s++) {
        const angle = (s / segments) * Math.PI * 2;
        orbitPoints.push(new THREE.Vector3(
          Math.cos(angle) * r,
          0,
          Math.sin(angle) * r
        ));
      }
      const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
      const orbitMat = new THREE.LineBasicMaterial({
        color: p.color,
        transparent: true,
        opacity: 0.2
      });
      const orbitLine = new THREE.Line(orbitGeo, orbitMat);
      scene.add(orbitLine);
      orbitLines.push(orbitLine);

      // Trail line (initially empty)
      const trailGeo = new THREE.BufferGeometry();
      trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(MAX_TRAIL_POINTS * 3), 3));
      trailGeo.setDrawRange(0, 0);
      const trailMat = new THREE.LineBasicMaterial({
        color: p.color,
        transparent: true,
        opacity: 0.5
      });
      const trailLine = new THREE.Line(trailGeo, trailMat);
      trailLine.visible = false;
      scene.add(trailLine);
      trailLines.push(trailLine);

      // Label sprite
      const label = createTextSprite(p.name, p.colorCSS);
      label.visible = true;
      scene.add(label);
      labelSprites.set(p.name, label);
    }

    // ── Star field (in-scene for parallax) ───
    const starCount = 3000;
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 800 + Math.random() * 1500;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);

      const brightness = Math.random() * 0.5 + 0.5;
      const hueShift = Math.random() > 0.9 ? 0.15 : 0;
      starColors[i * 3] = brightness * (1 - hueShift);
      starColors[i * 3 + 1] = brightness * (1 - hueShift * 0.5);
      starColors[i * 3 + 2] = brightness;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const starMat = new THREE.PointsMaterial({
      size: 1.2,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      sizeAttenuation: true,
      depthWrite: false
    });
    starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // ── Event listeners ─────────────
    window.addEventListener('resize', onResize);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('click', onClick);
    canvas.addEventListener('touchstart', onTouch, { passive: true });
  }

  /** Handle window resize. */
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  /**
   * Handle mouse move for hover detection.
   * @param {MouseEvent} e
   */
  function onMouseMove(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    // Raycast
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planetMeshes);

    const tooltip = document.getElementById('tooltip');
    const canvas = document.getElementById('main-canvas');

    if (intersects.length > 0) {
      const obj = intersects[0].object;
      const name = obj.userData.name;
      if (name !== hoveredPlanet) {
        hoveredPlanet = name;
        tooltip.textContent = name;
        tooltip.classList.add('visible');
        canvas.style.cursor = 'pointer';
      }
      tooltip.style.left = `${e.clientX + 14}px`;
      tooltip.style.top = `${e.clientY + 14}px`;
    } else {
      if (hoveredPlanet) {
        hoveredPlanet = null;
        tooltip.classList.remove('visible');
        canvas.style.cursor = 'grab';
      }
    }
  }

  /**
   * Handle click for planet selection.
   * @param {MouseEvent} e
   */
  function onClick(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planetMeshes);
    if (intersects.length > 0) {
      const name = intersects[0].object.userData.name;
      Router.navigate(`/planet/${name.toLowerCase()}`);
    }
  }

  /**
   * Handle touch events for mobile planet selection.
   * @param {TouchEvent} e
   */
  function onTouch(e) {
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planetMeshes);
    if (intersects.length > 0) {
      const name = intersects[0].object.userData.name;
      Router.navigate(`/planet/${name.toLowerCase()}`);
    }
  }

  /**
   * Fly camera to a planet.
   * @param {number} index - Planet index
   */
  function flyToPlanet(index) {
    const mesh = planetMeshes[index];
    if (!mesh) return;
    const pos = mesh.position.clone();
    const offset = PLANETS[index].distance * AU * 0.15 + 8;
    const targetCam = pos.clone().add(new THREE.Vector3(offset, offset * 0.6, offset));

    if (typeof gsap !== 'undefined' && !reducedMotion) {
      gsap.to(camera.position, {
        x: targetCam.x, y: targetCam.y, z: targetCam.z,
        duration: 1.8, ease: 'power2.inOut',
        onUpdate: () => controls.update()
      });
      gsap.to(controls.target, {
        x: pos.x, y: pos.y, z: pos.z,
        duration: 1.8, ease: 'power2.inOut'
      });
    } else {
      camera.position.copy(targetCam);
      controls.target.copy(pos);
      controls.update();
    }
  }

  /**
   * Reset camera to overview position.
   */
  function resetView() {
    const target = new THREE.Vector3(0, 0, 0);
    const pos = new THREE.Vector3(30, 45, 80);
    if (typeof gsap !== 'undefined' && !reducedMotion) {
      gsap.to(camera.position, { x: pos.x, y: pos.y, z: pos.z, duration: 1.5, ease: 'power2.inOut' });
      gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.5, ease: 'power2.inOut' });
    } else {
      camera.position.copy(pos);
      controls.target.copy(target);
      controls.update();
    }
  }

  /** @type {number} Frame counter for texture animation */
  let frameCount = 0;

  /**
   * Update planet positions from physics data and render.
   * @param {Float64Array} [positions] - Flat position array from worker
   * @param {Float64Array} [velocities] - Flat velocity array from worker
   */
  function update(positions, velocities) {
    frameCount++;

    // Update planet mesh positions
    if (positions) {
      for (let i = 0; i < PLANETS.length; i++) {
        const mesh = planetMeshes[i];
        mesh.position.set(
          positions[i * 3],
          positions[i * 3 + 1],
          positions[i * 3 + 2]
        );

        // Planet rotation
        mesh.rotation.y += 0.003 / Math.max(Math.abs(PLANETS[i].rotPeriod / 24), 0.5);

        // Label positioning
        const label = labelSprites.get(PLANETS[i].name);
        if (label) {
          const visualRadius = Math.max(Math.log(PLANETS[i].radius + 1) * SIZE_SCALE + 0.3, 0.35);
          label.position.set(
            mesh.position.x,
            mesh.position.y + visualRadius + 1.8,
            mesh.position.z
          );
          label.visible = state.showLabels;
        }

        // Orbit line visibility
        orbitLines[i].visible = state.showOrbits;

        // Trail update
        if (state.showTrails) {
          trailLines[i].visible = true;
          const hist = trailHistory[i];
          hist.push(mesh.position.x, mesh.position.y, mesh.position.z);
          if (hist.length > MAX_TRAIL_POINTS * 3) {
            hist.splice(0, 3);
          }
          const posAttr = trailLines[i].geometry.attributes.position;
          const arr = posAttr.array;
          const pts = hist.length / 3;
          for (let j = 0; j < pts; j++) {
            arr[j * 3] = hist[j * 3];
            arr[j * 3 + 1] = hist[j * 3 + 1];
            arr[j * 3 + 2] = hist[j * 3 + 2];
          }
          posAttr.needsUpdate = true;
          trailLines[i].geometry.setDrawRange(0, pts);
        } else {
          trailLines[i].visible = false;
        }
      }
    }

    // Animate sun
    const sunPulse = Math.sin(frameCount * 0.02) * 0.08 + 1.0;
    sunMesh.scale.setScalar(sunPulse);
    sunGlow.scale.setScalar(SUN_RADIUS * 6 * (sunPulse * 0.5 + 0.75));
    sunMesh.rotation.y += 0.001;

    // Controls
    controls.update();

    // Render
    renderer.render(scene, camera);
  }

  return { init, update, flyToPlanet, resetView, get camera() { return camera; } };
})();


/* ╔═══════════════════════════════════════════════════╗
   ║  9. DATA VISUALISATION (raw SVG + JS)             ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Live SVG chart engine — updates at animation frame rate.
 * Three charts: velocity bar chart, distance line chart, gravity bars.
 * @namespace Charts
 */
const Charts = (() => {
  /** @type {number[][]} Rolling history of distances per planet */
  const distHistory = PLANETS.map(() => []);

  const COLORS = PLANETS.map(p => p.colorCSS);
  const PADDING = { top: 8, right: 8, bottom: 20, left: 35 };
  const W = 300;
  const H = 120;

  /**
   * Initialise all chart SVGs with axes and static elements.
   */
  function init() {
    initVelocityChart();
    initDistanceChart();
    initGravityChart();
  }

  /**
   * Create SVG element helper.
   * @param {string} tag
   * @param {Object} attrs
   * @returns {SVGElement}
   */
  function svgEl(tag, attrs = {}) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) {
      el.setAttribute(k, String(v));
    }
    return el;
  }

  /** Initialise velocity bar chart */
  function initVelocityChart() {
    const svg = document.getElementById('chart-velocity');
    if (!svg) return;
    svg.innerHTML = '';

    // Y-axis label
    const label = svgEl('text', {
      x: 2, y: PADDING.top + (H - PADDING.top - PADDING.bottom) / 2,
      fill: 'var(--color-text-dim)', 'font-size': '8', 'text-anchor': 'start',
      transform: `rotate(-90, 8, ${PADDING.top + (H - PADDING.top - PADDING.bottom) / 2})`
    });
    label.textContent = 'km/s';
    svg.appendChild(label);

    // Bars group
    const barsGroup = svgEl('g', { id: 'vel-bars' });
    svg.appendChild(barsGroup);

    // Planet name labels
    const labelsGroup = svgEl('g', { id: 'vel-labels' });
    svg.appendChild(labelsGroup);
  }

  /** Initialise distance line chart */
  function initDistanceChart() {
    const svg = document.getElementById('chart-distance');
    if (!svg) return;
    svg.innerHTML = '';

    // Grid lines
    for (let i = 0; i <= 4; i++) {
      const y = PADDING.top + ((H - PADDING.top - PADDING.bottom) / 4) * i;
      svg.appendChild(svgEl('line', {
        x1: PADDING.left, y1: y, x2: W - PADDING.right, y2: y,
        stroke: 'var(--color-border)', 'stroke-width': 0.5
      }));
    }

    // Paths for each planet
    for (let i = 0; i < PLANETS.length; i++) {
      const path = svgEl('path', {
        id: `dist-path-${i}`, fill: 'none', stroke: COLORS[i],
        'stroke-width': 1.2, opacity: 0.8
      });
      svg.appendChild(path);
    }
  }

  /** Initialise gravity bar chart */
  function initGravityChart() {
    const svg = document.getElementById('chart-gravity');
    if (!svg) return;
    svg.innerHTML = '';

    const barsGroup = svgEl('g', { id: 'grav-bars' });
    svg.appendChild(barsGroup);

    const labelsGroup = svgEl('g', { id: 'grav-labels' });
    svg.appendChild(labelsGroup);
  }

  /**
   * Update all charts with new physics data.
   * @param {Float64Array} positions  - Planet positions
   * @param {Float64Array} velocities - Planet velocities
   * @param {Float64Array} forces     - Gravitational forces
   */
  function update(positions, velocities, forces) {
    if (!positions || !velocities || !forces) return;

    try {
      updateVelocityChart(velocities);
      updateDistanceChart(positions);
      updateGravityChart(forces);
    } catch (err) {
      console.error('[Charts] Update error:', err);
    }
  }

  /**
   * Update velocity bar chart.
   * @param {Float64Array} velocities
   */
  function updateVelocityChart(velocities) {
    const svg = document.getElementById('chart-velocity');
    const barsGroup = svg?.querySelector('#vel-bars');
    const labelsGroup = svg?.querySelector('#vel-labels');
    if (!barsGroup) return;

    barsGroup.innerHTML = '';
    labelsGroup.innerHTML = '';

    const chartW = W - PADDING.left - PADDING.right;
    const chartH = H - PADDING.top - PADDING.bottom;
    const barW = chartW / PLANETS.length - 4;

    let maxV = 0;
    const speeds = [];
    for (let i = 0; i < PLANETS.length; i++) {
      const vx = velocities[i * 3] || 0;
      const vy = velocities[i * 3 + 1] || 0;
      const vz = velocities[i * 3 + 2] || 0;
      const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
      speeds.push(speed);
      if (speed > maxV) maxV = speed;
    }
    if (maxV === 0) maxV = 1;

    for (let i = 0; i < PLANETS.length; i++) {
      const barH = (speeds[i] / maxV) * chartH;
      const x = PADDING.left + i * (chartW / PLANETS.length) + 2;
      const y = PADDING.top + chartH - barH;

      const rect = svgEl('rect', {
        x, y, width: barW, height: Math.max(barH, 1),
        fill: COLORS[i], rx: 2, opacity: 0.85
      });
      barsGroup.appendChild(rect);

      // Planet initial
      const text = svgEl('text', {
        x: x + barW / 2, y: H - 4,
        fill: 'var(--color-text-dim)', 'font-size': '7', 'text-anchor': 'middle'
      });
      text.textContent = PLANETS[i].name[0];
      labelsGroup.appendChild(text);
    }
  }

  /**
   * Update distance line chart.
   * @param {Float64Array} positions
   */
  function updateDistanceChart(positions) {
    const chartW = W - PADDING.left - PADDING.right;
    const chartH = H - PADDING.top - PADDING.bottom;

    for (let i = 0; i < PLANETS.length; i++) {
      const x = positions[i * 3] || 0;
      const y = positions[i * 3 + 1] || 0;
      const z = positions[i * 3 + 2] || 0;
      const dist = Math.sqrt(x * x + y * y + z * z) / AU;
      distHistory[i].push(dist);
      if (distHistory[i].length > CHART_HISTORY) {
        distHistory[i].shift();
      }
    }

    // Find max distance for scaling
    let maxDist = 1;
    for (let i = 0; i < PLANETS.length; i++) {
      for (const d of distHistory[i]) {
        if (d > maxDist) maxDist = d;
      }
    }

    for (let i = 0; i < PLANETS.length; i++) {
      const path = document.getElementById(`dist-path-${i}`);
      if (!path) continue;
      const hist = distHistory[i];
      if (hist.length < 2) { path.setAttribute('d', ''); continue; }

      let d = '';
      for (let j = 0; j < hist.length; j++) {
        const px = PADDING.left + (j / (CHART_HISTORY - 1)) * chartW;
        const py = PADDING.top + chartH - (hist[j] / maxDist) * chartH;
        d += j === 0 ? `M${px},${py}` : ` L${px},${py}`;
      }
      path.setAttribute('d', d);
    }
  }

  /**
   * Update gravity bar chart (logarithmic scale).
   * @param {Float64Array} forces
   */
  function updateGravityChart(forces) {
    const svg = document.getElementById('chart-gravity');
    const barsGroup = svg?.querySelector('#grav-bars');
    const labelsGroup = svg?.querySelector('#grav-labels');
    if (!barsGroup) return;

    barsGroup.innerHTML = '';
    labelsGroup.innerHTML = '';

    const chartW = W - PADDING.left - PADDING.right;
    const chartH = H - PADDING.top - PADDING.bottom;
    const barW = chartW / PLANETS.length - 4;

    let maxLogF = 0;
    const logForces = [];
    for (let i = 0; i < PLANETS.length; i++) {
      const lf = Math.log10(forces[i] + 1e-10) + 10; // shift to positive
      logForces.push(Math.max(lf, 0));
      if (lf > maxLogF) maxLogF = lf;
    }
    if (maxLogF === 0) maxLogF = 1;

    for (let i = 0; i < PLANETS.length; i++) {
      const barH = (logForces[i] / maxLogF) * chartH;
      const x = PADDING.left + i * (chartW / PLANETS.length) + 2;
      const y = PADDING.top + chartH - barH;

      const rect = svgEl('rect', {
        x, y, width: barW, height: Math.max(barH, 1),
        fill: COLORS[i], rx: 2, opacity: 0.85
      });
      barsGroup.appendChild(rect);

      const text = svgEl('text', {
        x: x + barW / 2, y: H - 4,
        fill: 'var(--color-text-dim)', 'font-size': '7', 'text-anchor': 'middle'
      });
      text.textContent = PLANETS[i].name[0];
      labelsGroup.appendChild(text);
    }
  }

  return { init, update };
})();

/**
 * Base class for shadow DOM components with reactive data binding.
 * @extends HTMLElement
 */
class BaseComponent extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    /** @type {Function[]} Cleanup functions for event listeners */
    this._cleanups = [];
  }

  /**
   * Called when the element is added to the DOM.
   * Override in subclasses to set up the component.
   */
  connectedCallback() {
    this.render();
  }

  /**
   * Called when the element is removed from the DOM.
   */
  disconnectedCallback() {
    this._cleanups.forEach(fn => fn());
    this._cleanups = [];
  }

  /**
   * Subscribe to an EventBus event with automatic cleanup.
   * @param {string} event
   * @param {Function} handler
   */
  listen(event, handler) {
    this._cleanups.push(EventBus.on(event, handler));
  }

  /**
   * Override to return shadow DOM HTML content.
   * @abstract
   */
  render() {}

  /**
   * Get shared CSS for all components.
   * @returns {string}
   */
  static get sharedStyles() {
    return `
      :host { display: block; font-family: inherit; color: var(--color-text, #d4d8e8); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
    `;
  }
}


/**
 * <planet-card> — displays planet info when selected.
 */
class PlanetCard extends BaseComponent {
  /** @type {PlanetData|null} */
  #planet = null;

  /**
   * Set the displayed planet.
   * @param {PlanetData|null} planet
   */
  set planet(planet) {
    this.#planet = planet;
    this.render();
  }

  /** @returns {PlanetData|null} */
  get planet() { return this.#planet; }

  render() {
    const p = this.#planet;
    if (!p) {
      this.shadowRoot.innerHTML = '';
      return;
    }

    this.shadowRoot.innerHTML = `
      <style>
        ${BaseComponent.sharedStyles}
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .orb { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
        .name { font-size: 1.5rem; font-weight: 700; }
        .desc { font-size: 0.82rem; line-height: 1.5; opacity: 0.8; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.82rem; }
        .label { opacity: 0.5; }
        .value { text-align: right; font-variant-numeric: tabular-nums; }
        .divider { border: none; border-top: 1px solid rgba(128,128,128,.15); margin: 16px 0; }
      </style>
      <div class="header">
        <div class="orb" style="background:${p.colorCSS}"></div>
        <div class="name">${p.name}</div>
      </div>
      <p class="desc">${p.description}</p>
      <hr class="divider">
      <div class="grid">
        <span class="label">Mass</span>
        <span class="value">${p.mass} M&#8853;</span>
        <span class="label">Radius</span>
        <span class="value">${p.radius} R&#8853;</span>
        <span class="label">Distance</span>
        <span class="value">${p.distance} AU</span>
        <span class="label">Orbital period</span>
        <span class="value">${p.period.toLocaleString()} days</span>
        <span class="label">Eccentricity</span>
        <span class="value">${p.eccentricity}</span>
        <span class="label">Axial tilt</span>
        <span class="value">${p.tilt}°</span>
        <span class="label">Surface temp</span>
        <span class="value">${p.surfaceTemp}</span>
        <span class="label">Atmosphere</span>
        <span class="value">${p.atmosphere}</span>
        <span class="label">Moons</span>
        <span class="value">${p.moons}</span>
        <span class="label">Day length</span>
        <span class="value">${Math.abs(p.rotPeriod).toFixed(1)} h</span>
      </div>
    `;
  }
}
customElements.define('planet-card', PlanetCard);

/**
 * Build the planet list in the sidebar.
 */
function buildPlanetList() {
  const list = document.getElementById('planet-list');
  if (!list) return;
  list.innerHTML = '';

  for (const planet of PLANETS) {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'planet-list-item';
    btn.setAttribute('role', 'link');
    btn.setAttribute('aria-label', `View ${planet.name}`);
    btn.innerHTML = `<span class="planet-dot" style="background:${planet.colorCSS}"></span> ${planet.name}`;
    btn.addEventListener('click', () => {
      Router.navigate(`/planet/${planet.name.toLowerCase()}`);
    });
    li.appendChild(btn);
    list.appendChild(li);
  }
}

/**
 * Update the active state in the planet list.
 * @param {string|null} name - Planet name or null
 */
function updatePlanetListActive(name) {
  const items = document.querySelectorAll('.planet-list-item');
  items.forEach(item => {
    const isActive = name && item.textContent.trim().toLowerCase() === name.toLowerCase();
    item.classList.toggle('active', isActive);
  });
}

/**
 * Show the planet info panel for a given planet.
 * @param {string} name - Planet name
 */
function showPlanetInfo(name) {
  const planet = PLANETS.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (!planet) return;

  const panel = document.getElementById('planet-info-panel');
  const content = document.getElementById('planet-info-content');
  if (!panel || !content) return;

  // Use our custom element
  content.innerHTML = '';
  const card = document.createElement('planet-card');
  card.planet = planet;
  content.appendChild(card);

  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  state.selectedPlanet = planet.name;
  updatePlanetListActive(planet.name);

  // Fly camera
  const idx = PLANETS.indexOf(planet);
  SceneManager.flyToPlanet(idx);

  // GSAP entrance
  if (typeof gsap !== 'undefined') {
    gsap.fromTo(panel, { x: 40, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.4, ease: 'power2.out' });
  }
}

/**
 * Close the planet info panel.
 */
function closePlanetInfo() {
  const panel = document.getElementById('planet-info-panel');
  if (panel) {
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
  }
  state.selectedPlanet = null;
  updatePlanetListActive(null);
}

/**
 * Set up all UI event handlers.
 */
function setupUIHandlers() {
  // Sidebar toggle
  document.getElementById('btn-sidebar-toggle')?.addEventListener('click', () => {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
    state.sidebarCollapsed = sidebar.classList.contains('collapsed');
  });

  // Close planet info
  document.getElementById('btn-close-info')?.addEventListener('click', () => {
    closePlanetInfo();
    Router.navigate('/');
  });

  // Theme toggle
  const themes = ['dark', 'light', 'high-contrast'];
  document.getElementById('btn-theme')?.addEventListener('click', () => {
    const current = themes.indexOf(state.theme);
    const next = themes[(current + 1) % themes.length];
    document.body.setAttribute('data-theme', next);
    state.theme = next;
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content',
      next === 'dark' ? '#06060f' : next === 'light' ? '#e8ecf4' : '#000000'
    );
  });

  // Fullscreen
  document.getElementById('btn-fullscreen')?.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  // Audio toggle
  document.getElementById('btn-audio-toggle')?.addEventListener('click', () => {
    if (AudioEngine.isPlaying) {
      AudioEngine.stop();
      state.audioEnabled = false;
      document.getElementById('audio-indicator')?.classList.add('muted');
    } else {
      AudioEngine.start();
      state.audioEnabled = true;
      document.getElementById('audio-indicator')?.classList.remove('muted');
    }
  });
  // Start muted
  document.getElementById('audio-indicator')?.classList.add('muted');

  // Time controls
  const speedDisplay = document.getElementById('speed-display');
  const rangeSpeed = document.getElementById('range-speed');

  /** @param {number} exp */
  function setTimeScale(exp) {
    state.timeScaleExp = Math.max(-2, Math.min(4, exp));
    const scale = Math.pow(10, state.timeScaleExp);
    if (speedDisplay) speedDisplay.textContent = `${scale.toFixed(scale < 10 ? 1 : 0)}x`;
    if (rangeSpeed) rangeSpeed.value = String(state.timeScaleExp);
  }

  document.getElementById('btn-slower')?.addEventListener('click', () => {
    setTimeScale(state.timeScaleExp - 0.5);
  });
  document.getElementById('btn-faster')?.addEventListener('click', () => {
    setTimeScale(state.timeScaleExp + 0.5);
  });
  document.getElementById('btn-pause')?.addEventListener('click', () => {
    state.paused = !state.paused;
    const btn = document.getElementById('btn-pause');
    if (btn) btn.innerHTML = state.paused ? '&#x25B6;' : '&#x23F8;';
    if (state.paused) {
      physicsWorker?.postMessage({ type: 'pause' });
    } else {
      physicsWorker?.postMessage({ type: 'resume' });
    }
  });
  rangeSpeed?.addEventListener('input', (e) => {
    setTimeScale(parseFloat(e.target.value));
  });

  // Reset view
  document.getElementById('btn-reset-view')?.addEventListener('click', () => {
    closePlanetInfo();
    SceneManager.resetView();
    Router.navigate('/');
  });

  // Sidebar checkboxes
  document.getElementById('chk-orbits')?.addEventListener('change', (e) => {
    state.showOrbits = e.target.checked;
  });
  document.getElementById('chk-labels')?.addEventListener('change', (e) => {
    state.showLabels = e.target.checked;
  });
  document.getElementById('chk-trails')?.addEventListener('change', (e) => {
    state.showTrails = e.target.checked;
  });

  // Mobile sidebar pull tab
  const pullTab = document.querySelector('.sidebar-pull-tab');
  pullTab?.addEventListener('click', () => {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('expanded');
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
    switch (e.key) {
      case ' ':
        e.preventDefault();
        document.getElementById('btn-pause')?.click();
        break;
      case 'Escape':
        closePlanetInfo();
        Router.navigate('/');
        break;
      case 's':
        document.getElementById('btn-sidebar-toggle')?.click();
        break;
      case 'm':
        document.getElementById('btn-audio-toggle')?.click();
        break;
      case 'ArrowUp':
        setTimeScale(state.timeScaleExp + 0.5);
        break;
      case 'ArrowDown':
        setTimeScale(state.timeScaleExp - 0.5);
        break;
    }
  });
}

/**
 * Register all application routes.
 */
function registerRoutes() {
  Router.addRoute('/', () => {
    closePlanetInfo();
  });

  Router.addRoute('/planet/:name', ({ name }) => {
    if (name) {
      showPlanetInfo(name);
    }
  });

  Router.addRoute('/settings', () => {
    closePlanetInfo();
    // Could expand to a settings panel in the future
  });
}
