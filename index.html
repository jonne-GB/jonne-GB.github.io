<!doctype html>
<html lang="en" data-accent="ember" data-cursor="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBweb — a studio for quieter internet · Leeuwarden</title>
<style>
/* ==========================================================================
   GBweb Design System — colors_and_type.css
   Warm, dark, editorial. Motion-forward.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  /* ---------- Palette ---------- */
  --bg-stage:        #141110;
  --bg-surface:      #1C1816;
  --bg-raised:       #252120;
  --bg-inverse:      #F2ECE3;

  --ink:             #232323;   /* wordmark color; for on-light copy */

  --fg-primary:      #F2ECE3;   /* bone */
  --fg-secondary:    #B8AFA3;
  --fg-tertiary:     #7A6F63;
  --fg-inverse:      #141110;

  --accent:          #5B8FD9;   /* cobalt */
  --accent-deep:     #2E5FAE;
  --accent-soft:     #9BB8E0;   /* ice */

  --rule:            rgba(242, 236, 227, 0.08);
  --rule-strong:     rgba(242, 236, 227, 0.16);
  --rule-ink:        rgba(35, 35, 35, 0.12);

  --success:         #8FA66B;
  --warning:         #E8B44C;
  --danger:          #C4503A;

  /* ---------- Type families ---------- */
  --font-display:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-serif:      "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-sans:       "Geist", ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
  --font-mono:       "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* ---------- Type scale ---------- */
  --fs-hero:         clamp(72px, 11vw, 180px);
  --fs-display:      clamp(48px, 6.5vw, 96px);
  --fs-h1:           clamp(40px, 4.5vw, 64px);
  --fs-h2:           clamp(28px, 3vw, 40px);
  --fs-h3:           22px;
  --fs-h4:           18px;
  --fs-body-lg:      20px;
  --fs-body:         17px;
  --fs-body-sm:      15px;
  --fs-caption:      13px;
  --fs-micro:        11px;

  /* ---------- Spacing ---------- */
  --s-0:    0px;
  --s-1:    4px;
  --s-2:    8px;
  --s-3:    12px;
  --s-4:    16px;
  --s-5:    24px;
  --s-6:    32px;
  --s-7:    48px;
  --s-8:    64px;
  --s-9:    96px;
  --s-10:   128px;
  --s-11:   192px;

  /* ---------- Radii ---------- */
  --r-xs:    2px;
  --r-sm:    4px;
  --r-md:    8px;
  --r-lg:    14px;
  --r-xl:    22px;
  --r-pill:  999px;

  /* ---------- Motion ---------- */
  --ease-out-expo:     cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out-quart: cubic-bezier(0.76, 0, 0.24, 1);
  --ease-soft-back:    cubic-bezier(0.34, 1.2, 0.64, 1);

  --dur-micro:    180ms;
  --dur-ui:       420ms;
  --dur-reveal:   900ms;
  --dur-hero:     1800ms;

  /* ---------- Shadow / elevation (sparse on dark) ---------- */
  --shadow-1: 0 1px 0 rgba(0, 0, 0, 0.4);
  --shadow-2: 0 1px 0 rgba(0, 0, 0, 0.5), 0 12px 24px -12px rgba(0, 0, 0, 0.5);
  --shadow-3: 0 1px 0 rgba(0, 0, 0, 0.5), 0 24px 48px -16px rgba(0, 0, 0, 0.6);
  --highlight-inset: inset 0 1px 0 rgba(255, 255, 255, 0.05);

  /* ---------- Layout ---------- */
  --container:   1440px;
  --gutter:      96px;
  --nav-h:       72px;
}

/* ==========================================================================
   Semantic typography classes
   ========================================================================== */

.t-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-tertiary);
}

.t-hero {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--fs-hero);
  line-height: 0.94;
  letter-spacing: -0.035em;
  color: var(--fg-primary);
  text-wrap: balance;
}

.t-hero em,
.t-display em,
.t-h1 em {
  font-family: var(--font-serif);
  font-weight: 400;
  font-style: italic;
  letter-spacing: -0.01em;
  color: var(--accent-soft);
}

.t-display {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--fs-display);
  line-height: 0.98;
  letter-spacing: -0.03em;
  color: var(--fg-primary);
  text-wrap: balance;
}

.t-h1 {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: var(--fs-h1);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--fg-primary);
  text-wrap: balance;
}

.t-h2 {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: var(--fs-h2);
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--fg-primary);
}

.t-h3 {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: var(--fs-h3);
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--fg-primary);
}

.t-h4 {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: var(--fs-h4);
  line-height: 1.35;
  color: var(--fg-primary);
}

.t-body-lg {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--fs-body-lg);
  line-height: 1.55;
  color: var(--fg-secondary);
  text-wrap: pretty;
}

.t-body {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--fs-body);
  line-height: 1.6;
  color: var(--fg-secondary);
  text-wrap: pretty;
}

.t-body-sm {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--fs-body-sm);
  line-height: 1.55;
  color: var(--fg-secondary);
}

.t-editorial {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.35;
  letter-spacing: -0.005em;
  color: var(--fg-primary);
}

.t-caption {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: var(--fs-caption);
  line-height: 1.4;
  letter-spacing: 0.02em;
  color: var(--fg-tertiary);
}

.t-micro {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--fs-micro);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-tertiary);
}

.t-link {
  color: var(--fg-primary);
  text-decoration: none;
  border-bottom: 1px solid var(--rule-strong);
  transition: border-color var(--dur-ui) var(--ease-out-expo),
              color var(--dur-ui) var(--ease-out-expo);
}
.t-link:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ==========================================================================
   Base element defaults (scoped via .gb-theme so this file is opt-in)
   ========================================================================== */

.gb-theme {
  background: var(--bg-stage);
  color: var(--fg-primary);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.gb-theme ::selection {
  background: var(--accent);
  color: var(--bg-stage);
}


/* GBweb — Leeuwarden studio site */


/* Accent override: README says ember (not the cobalt in colors_and_type.css).
   We also expose it as a *root-scoped* var so Tweaks can cycle it at runtime. */
:root {
  --accent:      #E06B3A;   /* ember */
  --accent-deep: #B24B24;
  --accent-soft: #D6A274;   /* clay */
}
:root[data-accent="ember"] { --accent: #E06B3A; --accent-deep: #B24B24; --accent-soft: #D6A274; }
:root[data-accent="clay"]  { --accent: #D6A274; --accent-deep: #A87848; --accent-soft: #E6C299; }
:root[data-accent="bone"]  { --accent: #F2ECE3; --accent-deep: #B8AFA3; --accent-soft: #F2ECE3; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html[data-cursor="on"] body,
html[data-cursor="on"] body a,
html[data-cursor="on"] body button { cursor: none; }
body {
  background: var(--bg-stage);
  color: var(--fg-primary);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: var(--accent); color: var(--bg-stage); }
a { color: inherit; text-decoration: none; }
button { border: none; background: transparent; color: inherit; font: inherit; }

/* ---------- Global overlays ---------- */
.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background-image: url('./assets/grain.svg');
  opacity: 0.08; mix-blend-mode: overlay;
}
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 99;
  background: radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,0.45) 100%);
}

/* ---------- Cursor ---------- */
.gb-cursor {
  position: fixed; top: 0; left: 0; z-index: 9999;
  pointer-events: none;
  width: 10px; height: 10px; margin: -5px 0 0 -5px;
  border-radius: 999px;
  background: var(--fg-primary);
  transition: width .32s var(--ease-out-expo),
              height .32s var(--ease-out-expo),
              margin .32s var(--ease-out-expo),
              background .32s var(--ease-out-expo),
              opacity .2s;
  display: flex; align-items: center; justify-content: center;
  mix-blend-mode: difference;
  will-change: transform;
}
.gb-cursor span { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--bg-stage); opacity: 0; transition: opacity .2s; white-space: nowrap; text-transform: uppercase; font-weight: 500; }
.gb-cursor.on { width: 80px; height: 80px; margin: -40px 0 0 -40px; background: var(--accent); mix-blend-mode: normal; }
.gb-cursor.on span { opacity: 1; color: var(--bg-stage); }
html[data-cursor="off"] .gb-cursor { display: none; }

/* ---------- Nav ---------- */
.nav-progress {
  position: fixed; top: 0; left: 0; height: 2px; background: var(--accent);
  z-index: 60; transition: width .1s linear;
}
.nav {
  position: fixed; top: 16px; left: 24px; right: 24px; z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 22px;
  background: rgba(20,17,16,0.55);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-md);
}
.nav-logo { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--fg-primary); letter-spacing: -0.02em; }
.nav-logo .dot { color: var(--accent); }
.nav-links { display: flex; gap: 28px; }
.nav-link { font-family: var(--font-sans); font-size: 13px; color: var(--fg-secondary); transition: color .32s var(--ease-out-expo); background: none; padding: 0; }
.nav-link:hover { color: var(--fg-primary); }
.nav-cta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); background: none; padding: 0; }

/* ---------- Split text hover ---------- */
.split span { display: inline-block; transition: transform .4s var(--ease-out-expo); }
.split:hover span { transform: translateY(-2px); }

/* ---------- Reveal on scroll ---------- */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity .9s var(--ease-out-expo), transform 1.1s var(--ease-out-expo); }
.reveal.in { opacity: 1; transform: translateY(0); }
.reveal.d1 { transition-delay: 80ms; }
.reveal.d2 { transition-delay: 160ms; }
.reveal.d3 { transition-delay: 240ms; }

/* Clip-path reveal for images/thumbs */
.clip { clip-path: inset(0 0 100% 0); transition: clip-path 1.2s var(--ease-out-expo); }
.clip.in { clip-path: inset(0 0 0 0); }

/* Split headline word reveal */
.headline-word { display: inline-block; overflow: hidden; vertical-align: top; }
.headline-word > span { display: inline-block; transform: translateY(110%); transition: transform 1s var(--ease-out-expo); }
.headline-word.in > span { transform: translateY(0); }

/* ---------- Page shell ---------- */
.section { padding: 140px 64px; max-width: 1440px; margin: 0 auto; position: relative; }
.section-tight { padding: 96px 64px; }
.t-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-tertiary); }

/* ==========================================================================
   HERO — three variants controlled by data-hero on <body>
   ========================================================================== */

.hero {
  padding: 140px 64px 96px; max-width: 1440px; margin: 0 auto;
  position: relative; min-height: 100vh;
  display: flex; flex-direction: column; justify-content: center;
}

.hero-eyebrow {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--fg-tertiary);
  display: flex; align-items: center; gap: 10px; margin-bottom: 48px;
}
.hero-eyebrow .dot { color: var(--accent); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

.hero-title {
  font-family: var(--font-sans); font-weight: 400;
  font-size: clamp(72px, 11vw, 168px); line-height: 0.94;
  letter-spacing: -0.035em; color: var(--fg-primary);
  margin: 0; text-wrap: balance;
}
.hero-title em {
  font-family: var(--font-serif); font-style: italic;
  color: var(--accent-soft); font-weight: 400; letter-spacing: -0.01em;
}
.hero-title .line { display: block; }
.hero-title .line.tight { letter-spacing: -0.045em; }

.hero-support { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 80px; align-items: end; }
.hero-lede { font-family: var(--font-sans); font-size: 19px; line-height: 1.55; color: var(--fg-secondary); max-width: 480px; text-wrap: pretty; }
.hero-actions { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.hero-meta { display: flex; gap: 48px; margin-top: 96px; padding-top: 28px; border-top: 1px solid var(--rule); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-tertiary); }
.hero-meta .k { color: var(--accent); margin-right: 8px; }

/* Hero variant: full-bleed image with overlay wordmark */
.hero-fullbleed { padding: 0; max-width: none; min-height: 100vh; overflow: hidden; }
.hero-fb-stage { position: relative; height: 100vh; width: 100%; overflow: hidden; }
.hero-fb-bg { position: absolute; inset: 0; background:
    radial-gradient(circle at 22% 30%, #3a2418 0%, transparent 55%),
    radial-gradient(circle at 78% 70%, #2a1812 0%, transparent 55%),
    linear-gradient(160deg, #1a1210 0%, #0d0807 100%);
  animation: herodrift 24s ease-in-out infinite alternate;
}
@keyframes herodrift {
  from { transform: scale(1.08) translate(-1%, -1%); }
  to   { transform: scale(1.14) translate(2%, 1%); }
}
.hero-fb-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,17,16,0.3) 0%, rgba(20,17,16,0.75) 100%); }
.hero-fb-content { position: relative; z-index: 2; height: 100%; padding: 120px 64px 64px; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; }
.hero-fb-wordmark { font-family: var(--font-sans); font-weight: 300; font-size: clamp(120px, 22vw, 360px); line-height: 0.8; letter-spacing: -0.05em; color: var(--fg-primary); margin: 0; }
.hero-fb-wordmark em { font-family: var(--font-serif); font-style: italic; color: var(--accent); }
.hero-fb-bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px; align-items: end; padding-bottom: 32px; }
.hero-fb-bottom .col { display: flex; flex-direction: column; gap: 10px; }
.hero-fb-tag { font-family: var(--font-sans); font-size: 19px; line-height: 1.4; color: var(--fg-primary); max-width: 360px; text-wrap: pretty; }

/* Hero variant: marquee behind sentence */
.hero-marquee-stage { position: relative; min-height: 100vh; padding: 160px 0 96px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.hero-mq-bg { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 4vh; pointer-events: none; opacity: 0.06; }
.hero-mq-row { font-family: var(--font-sans); font-weight: 400; font-size: clamp(80px, 14vw, 220px); line-height: 0.9; letter-spacing: -0.04em; color: var(--fg-primary); white-space: nowrap; display: flex; gap: 80px; }
.hero-mq-row.r1 { animation: slideLeft 48s linear infinite; }
.hero-mq-row.r2 { animation: slideRight 56s linear infinite; align-self: flex-end; }
.hero-mq-row.r3 { animation: slideLeft 64s linear infinite; }
@keyframes slideLeft { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes slideRight { from { transform: translateX(-50%); } to { transform: translateX(0); } }
.hero-mq-front { position: relative; z-index: 2; padding: 0 64px; max-width: 1440px; margin: 0 auto; width: 100%; box-sizing: border-box; }

/* ---------- Buttons ---------- */
.btn { font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 14px 24px; border-radius: 2px; border: 1px solid var(--rule-strong); transition: all .32s var(--ease-out-expo); letter-spacing: -0.005em; display: inline-flex; align-items: center; gap: 10px; background: transparent; color: var(--fg-primary); }
.btn .arr { transition: transform .32s var(--ease-out-expo); display: inline-block; }
.btn:hover .arr { transform: translate(3px,-3px); }
.btn-primary { background: var(--accent); color: var(--bg-stage); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-deep); }
.btn-ghost { background: transparent; color: var(--fg-primary); border-color: transparent; border-bottom: 1px solid var(--rule-strong); border-radius: 0; padding: 14px 4px; }
.btn-ghost:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- Manifesto / Editorial block ---------- */
.manifesto { padding: 160px 64px; max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 3fr 9fr; gap: 64px; border-top: 1px solid var(--rule); }
.manifesto-body { font-family: var(--font-serif); font-style: italic; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.25; color: var(--fg-primary); letter-spacing: -0.01em; text-wrap: balance; }
.manifesto-body .acc { color: var(--accent-soft); font-style: italic; }
.manifesto-body .ink { color: var(--fg-tertiary); }

/* ---------- Selected work ---------- */
.work { padding: 140px 64px 64px; max-width: 1440px; margin: 0 auto; border-top: 1px solid var(--rule); }
.work-head { display: grid; grid-template-columns: 1fr 2fr; gap: 48px; align-items: start; margin-bottom: 80px; }
.work-title { font-family: var(--font-sans); font-weight: 400; font-size: clamp(48px, 6vw, 84px); line-height: 0.98; letter-spacing: -0.03em; margin: 0; color: var(--fg-primary); }
.work-title em { font-family: var(--font-serif); font-style: italic; color: var(--accent-soft); }

.work-list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.work-row { display: grid; grid-template-columns: 60px 1fr 1fr 1fr 60px; gap: 32px; align-items: center; padding: 36px 0; border-bottom: 1px solid var(--rule); position: relative; cursor: pointer; transition: padding .4s var(--ease-out-expo); }
.work-row:hover { padding-left: 24px; padding-right: 24px; }
.work-row .idx { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--fg-tertiary); }
.work-row .title { font-family: var(--font-sans); font-weight: 400; font-size: clamp(32px, 4vw, 56px); letter-spacing: -0.025em; color: var(--fg-primary); line-height: 1; transition: color .4s var(--ease-out-expo); }
.work-row:hover .title { color: var(--accent-soft); }
.work-row .role { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-secondary); }
.work-row .year { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--fg-secondary); }
.work-row .arr { font-family: var(--font-serif); font-style: italic; font-size: 28px; color: var(--accent-soft); transition: transform .4s var(--ease-out-expo); text-align: right; }
.work-row:hover .arr { transform: translate(6px,-6px); }

/* Hover-preview thumb that rides the cursor */
.work-preview {
  position: fixed; top: 0; left: 0;
  width: 420px; height: 300px;
  border-radius: var(--r-md);
  pointer-events: none; z-index: 40;
  opacity: 0; transform: translate(-50%,-50%) scale(0.92);
  transition: opacity .32s var(--ease-out-expo), transform .4s var(--ease-out-expo);
  overflow: hidden; border: 1px solid var(--rule-strong);
  will-change: transform;
}
.work-preview.on { opacity: 1; transform: translate(-50%,-50%) scale(1); }
.work-preview-inner { position: absolute; inset: 0; }
.work-preview-glow { position: absolute; inset: 0; }
.work-preview-label { position: absolute; bottom: 16px; left: 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-primary); text-transform: uppercase; }

/* ---------- Process (steps) ---------- */
.process { padding: 160px 64px; max-width: 1440px; margin: 0 auto; border-top: 1px solid var(--rule); }
.process-head { display: grid; grid-template-columns: 1fr 2fr; gap: 48px; margin-bottom: 96px; align-items: end; }
.process-head .work-title { max-width: 820px; }

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
/* Chrome: Cursor, Nav, Marquee, SplitText, scroll reveal helpers */
const { useState: useStateCh, useEffect: useEffectCh, useRef: useRefCh } = React;

/* ---------- SplitText: letter-staggered hover ---------- */
function SplitText({ children, className = "", as = "span" }) {
  const Tag = as;
  const text = typeof children === "string" ? children : "";
  return (
    <Tag className={`split ${className}`}>
      {text.split("").map((c, i) => (
        <span key={i} style={{ transitionDelay: `${i * 18}ms` }}>
          {c === " " ? "\u00A0" : c}
        </span>
      ))}
    </Tag>
  );
}

/* ---------- Animated split headline: word-by-word translateY reveal ---------- */
function Headline({ lines, revealed }) {
  // lines: array of arrays of { word, em? }
  return (
    <h1 className="hero-title">
      {lines.map((line, li) => (
        <span className="line" key={li}>
          {line.map((tok, ti) => {
            const delay = (li * 120) + (ti * 80);
            const inner = tok.em ? <em>{tok.word}</em> : tok.word;
            return (
              <span
                key={ti}
                className={`headline-word ${revealed ? "in" : ""}`}
                style={{ transitionDelay: `${delay}ms` }}
              >
                <span style={{ transitionDelay: `${delay}ms` }}>
                  {inner}
                  {ti < line.length - 1 ? "\u00A0" : ""}
                </span>
              </span>
            );
          })}
        </span>
      ))}
    </h1>
  );
}

/* ---------- Cursor with label pill ---------- */
function Cursor() {
  const ref = useRefCh(null);
  const [label, setLabel] = useStateCh(null);
  useEffectCh(() => {
    const pos = { x: -50, y: -50 };
    const tgt = { x: -50, y: -50 };
    let raf;
    const tick = () => {
      // damped follow for a weightier feel
      pos.x += (tgt.x - pos.x) * 0.22;
      pos.y += (tgt.y - pos.y) * 0.22;
      if (ref.current) {
        ref.current.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    const move = (e) => { tgt.x = e.clientX; tgt.y = e.clientY; };
    const over = (e) => {
      const t = e.target.closest("[data-cursor]");
      setLabel(t ? t.getAttribute("data-cursor") : null);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseover", over);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseover", over);
    };
  }, []);
  return (
    <div ref={ref} className={`gb-cursor ${label ? "on" : ""}`}>
      <span>{label || ""}</span>
    </div>
  );
}

/* ---------- Marquee ---------- */
function Marquee({ items }) {
  const row = (
    <div className="mq-row">
      {items.map((it, i) => (
        <span key={i} className="mq-item">
          {it.text}{it.em && <em>&nbsp;{it.em}</em>} {it.dot && <span className="mq-dot">●</span>}
        </span>
      ))}
    </div>
  );
  return (
    <div className="mq">
      <div className="mq-track">{row}{row}</div>
    </div>
  );
}

/* ---------- Nav ---------- */
function Nav({ scroll, onOpenTweaks }) {
  const links = [
    ["work", "Work"],
    ["studio", "Studio"],
    ["process", "Process"],
    ["contact", "Contact"],
  ];
  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  return (
    <>
      <div className="nav-progress" style={{ width: `${scroll}%` }} />
      <nav className="nav">
        <button className="nav-logo" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} data-cursor="Home">
          gbweb<span className="dot">·</span>
        </button>
        <div className="nav-links">
          {links.map(([id, label]) => (
            <button
              key={id}
              className="nav-link"
              onClick={() => scrollTo(id)}
              data-cursor={label}
            >
              <SplitText>{label}</SplitText>
            </button>
          ))}
        </div>
        <button className="nav-cta" onClick={() => scrollTo("contact")} data-cursor="Start">
          Start a project ↗
        </button>
      </nav>
    </>
  );
}

/* ---------- useInView hook for scroll reveals ---------- */
function useInView(threshold = 0.15) {
  const ref = useRefCh(null);
  const [inView, setInView] = useStateCh(false);
  useEffectCh(() => {
    if (!ref.current) return;
    const el = ref.current;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) { setInView(true); io.unobserve(el); } }),
      { threshold, rootMargin: "0px 0px -10% 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);
  return [ref, inView];
}

Object.assign(window, { SplitText, Headline, Cursor, Marquee, Nav, useInView });

<script type="text/babel">
const { useState, useEffect } = React;

/* Tweakable defaults — host rewrites the JSON between the markers on persist. */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "ember",
  "heroVariant": "split",
  "cursorOn": false
}/*EDITMODE-END*/;

function App() {
  const [accent, setAccent] = useState(() => localStorage.getItem("gb-accent") || TWEAK_DEFAULTS.accent);
  const [heroVariant, setHeroVariant] = useState(() => localStorage.getItem("gb-hero") || TWEAK_DEFAULTS.heroVariant);
  const [cursorOn, setCursorOn] = useState(() => {
    const v = localStorage.getItem("gb-cursor");
    return v === null ? TWEAK_DEFAULTS.cursorOn : v === "true";
  });
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [scroll, setScroll] = useState(0);

  /* Persist + apply html-level data attrs */
  useEffect(() => {
    document.documentElement.setAttribute("data-accent", accent);
    localStorage.setItem("gb-accent", accent);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { accent } }, "*");
  }, [accent]);
  useEffect(() => {
    localStorage.setItem("gb-hero", heroVariant);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { heroVariant } }, "*");
  }, [heroVariant]);
  useEffect(() => {
    document.documentElement.setAttribute("data-cursor", cursorOn ? "on" : "off");
    localStorage.setItem("gb-cursor", String(cursorOn));
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { cursorOn } }, "*");
  }, [cursorOn]);

  /* Tweaks toggle protocol */
  useEffect(() => {
    const onMsg = (e) => {
      const t = e.data && e.data.type;
      if (t === "__activate_edit_mode") setTweaksOpen(true);
      if (t === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    // Announce availability only after listener is live.
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  /* Scroll progress */
  useEffect(() => {
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      setScroll(max > 0 ? (window.scrollY / max) * 100 : 0);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <div className="app">
      <div className="grain" />
      <div className="vignette" />
      {cursorOn && <Cursor />}
      <Nav scroll={scroll} />
      <Hero variant={heroVariant} />
      <Manifesto />
      <WorkList />
      <Process />
      <Quote />
      <Stats />
      <CTA />
      <Footer />
      <Tweaks
        open={tweaksOpen}
        accent={accent} setAccent={setAccent}
        heroVariant={heroVariant} setHeroVariant={setHeroVariant}
        cursorOn={cursorOn} setCursorOn={setCursorOn}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
