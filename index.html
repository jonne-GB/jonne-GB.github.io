/**
 * Register a CSS Paint Worklet for custom background patterns.
 * Falls back gracefully if Paint API is not supported.
 */
function initPaintWorklet() {
  if (typeof CSS === 'undefined' || !CSS.paintWorklet) {
    console.info('[PaintWorklet] CSS Paint API not supported — skipping.');
    return;
  }

  const workletSrc = `
    class StarfieldPainter {
      static get inputProperties() {
        return ['--starfield-density', '--starfield-seed'];
      }
      paint(ctx, size, props) {
        const density = parseInt(props.get('--starfield-density')?.toString()) || 80;
        const seed = parseInt(props.get('--starfield-seed')?.toString()) || 42;
        // Simple seeded random
        let s = seed;
        function rand() { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; }

        ctx.fillStyle = 'transparent';
        ctx.fillRect(0, 0, size.width, size.height);

        for (let i = 0; i < density; i++) {
          const x = rand() * size.width;
          const y = rand() * size.height;
          const r = rand() * 1.2 + 0.2;
          const alpha = rand() * 0.4 + 0.1;
          ctx.fillStyle = 'rgba(180,190,220,' + alpha + ')';
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    registerPaint('starfield', StarfieldPainter);
  `;

  try {
    const blob = new Blob([workletSrc], { type: 'application/javascript' });
    CSS.paintWorklet.addModule(URL.createObjectURL(blob));
  } catch (err) {
    console.warn('[PaintWorklet] Registration failed:', err);
  }
}


/* ╔═══════════════════════════════════════════════════╗
   ║  14. PWA — SERVICE WORKER & MANIFEST              ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Dynamically create and link a web app manifest.
 */
function createManifest() {
  try {
    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="64" fill="#06060f"/><circle cx="256" cy="256" r="32" fill="#FDB813"/><circle cx="256" cy="256" r="60" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity=".4"/><circle cx="316" cy="256" r="5" fill="#4B7BE5"/><circle cx="256" cy="256" r="100" fill="none" stroke="#C1440E" stroke-width="1" opacity=".3"/><circle cx="356" cy="256" r="4" fill="#C1440E"/><circle cx="256" cy="256" r="150" fill="none" stroke="#C88B3A" stroke-width="1" opacity=".25"/><circle cx="406" cy="256" r="8" fill="#C88B3A"/></svg>`;
    const iconDataURI = `data:image/svg+xml;base64,${btoa(iconSvg)}`;

    const manifest = {
      name: 'Solar System Dashboard',
      short_name: 'SolarSys',
      description: 'Interactive 3D solar system with real-time physics simulation',
      start_url: '.',
      display: 'standalone',
      orientation: 'any',
      background_color: '#06060f',
      theme_color: '#06060f',
      icons: [
        { src: iconDataURI, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }
      ]
    };

    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (err) {
    console.warn('[PWA] Manifest creation failed:', err);
  }
}

/**
 * Register the service worker for offline support.
 * Uses blob URL — works on localhost; production should use a real sw.js file.
 */
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;

  const swCode = `
    const CACHE = 'solar-system-v1';
    const ASSETS = ['/'];

    self.addEventListener('install', (e) => {
      e.waitUntil(
        caches.open(CACHE).then(cache => cache.addAll(ASSETS)).then(() => self.skipWaiting())
      );
    });

    self.addEventListener('activate', (e) => {
      e.waitUntil(
        caches.keys().then(keys =>
          Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
        ).then(() => self.clients.claim())
      );
    });

    self.addEventListener('fetch', (e) => {
      e.respondWith(
        caches.match(e.request).then(cached => {
          if (cached) return cached;
          return fetch(e.request).then(response => {
            if (response.ok && e.request.method === 'GET') {
              const clone = response.clone();
              caches.open(CACHE).then(cache => cache.put(e.request, clone));
            }
            return response;
          }).catch(() => cached);
        })
      );
    });
  `;

  // Service workers must be served from the same origin as a file.
  // Blob URLs are NOT valid for SW registration in production.
  // For a single-file demo we attempt it, with graceful fallback.
  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: '/' })
      .then(() => console.info('[SW] Registered (blob URL)'))
      .catch(() => {
        // Expected in most browsers — blob SW not supported.
        // In production, extract swCode to sw.js and register that.
        console.info('[SW] Blob registration not supported. For full PWA, deploy sw.js alongside index.html.');
      });
  } catch {
    console.info('[SW] Service Worker registration skipped.');
  }
}


/* ╔═══════════════════════════════════════════════════╗
   ║  15. MAIN ANIMATION LOOP                         ║
   ╚═══════════════════════════════════════════════════╝ */

/** @type {Float64Array|null} Latest positions from worker */
let latestPositions = null;
/** @type {Float64Array|null} Latest velocities from worker */
let latestVelocities = null;
/** @type {Float64Array|null} Latest forces from worker */
let latestForces = null;
/** @type {number} Frame counter for throttled chart updates */
let loopFrame = 0;

/**
 * Main render/update loop — runs at display refresh rate.
 */
function mainLoop() {
  try {
    loopFrame++;

    // Request next physics tick
    if (!state.paused && physicsWorker) {
      const timeScale = Math.pow(10, state.timeScaleExp);
      physicsWorker.postMessage({ type: 'tick', timeScale });
    }

    // Update 3D scene
    SceneManager.update(latestPositions, latestVelocities);

    // Update charts at ~20fps to save CPU
    if (loopFrame % 3 === 0 && latestPositions) {
      Charts.update(latestPositions, latestVelocities, latestForces);
    }

    // Update audio
    if (state.audioEnabled && loopFrame % 6 === 0) {
      AudioEngine.update(
        Math.pow(10, state.timeScaleExp),
        latestVelocities
      );
    }

  } catch (err) {
    console.error('[MainLoop] Error:', err);
  }

  requestAnimationFrame(mainLoop);
}


/* ╔═══════════════════════════════════════════════════╗
   ║  16. APP INITIALISATION                           ║
   ╚═══════════════════════════════════════════════════╝ */

/**
 * Boot the entire application.
 */
async function boot() {
  try {
    // 1. Detect preferences
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (!prefersDark && state.theme === 'dark') {
      // Keep dark as default for space app, but respect OS preference
    }

    // 2. Paint worklet (non-blocking)
    initPaintWorklet();

    // 3. PWA manifest
    createManifest();

    // 4. Init background worker (stars)
    initBackgroundWorker();

    // 5. Init Three.js scene
    SceneManager.init();

    // 6. Init physics worker
    initPhysicsWorker();

    // Listen for physics updates
    if (physicsWorker) {
      const originalOnMessage = physicsWorker.onmessage;
      physicsWorker.onmessage = (e) => {
        if (e.data.type === 'update') {
          // We need to copy the data since transferable buffers are neutered
          latestPositions = new Float64Array(e.data.positions || []);
          latestVelocities = new Float64Array(e.data.velocities || []);
          latestForces = new Float64Array(e.data.forces || []);
        }
        // Also call original handler for state updates
        originalOnMessage?.(e);
      };
    }

    // 7. Init charts
    Charts.init();

    // 8. Init audio engine (stays suspended until user clicks)
    AudioEngine.init();

    // 9. Build UI
    buildPlanetList();
    setupUIHandlers();

    // 10. Register routes & start router
    registerRoutes();
    Router.init();

    // 11. Register service worker
    registerServiceWorker();

    // 12. Start main loop
    requestAnimationFrame(mainLoop);

    // 13. Hide loading overlay
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      if (typeof gsap !== 'undefined' && !prefersReducedMotion) {
        gsap.to(overlay, {
          opacity: 0,
          duration: 0.8,
          delay: 0.5,
          ease: 'power2.inOut',
          onComplete: () => overlay.classList.add('hidden')
        });
      } else {
        setTimeout(() => overlay.classList.add('hidden'), 300);
      }
    }

    // 14. Entrance animation
    if (typeof gsap !== 'undefined' && !prefersReducedMotion) {
      gsap.from('#app-header', { y: -60, opacity: 0, duration: 0.8, delay: 0.6, ease: 'power3.out' });
      gsap.from('#sidebar', { x: -100, opacity: 0, duration: 0.8, delay: 0.8, ease: 'power3.out' });
      gsap.from('#time-controls', { y: 60, opacity: 0, duration: 0.8, delay: 1.0, ease: 'power3.out' });
    }

    console.info(
      '%c Solar System Dashboard %c Loaded ',
      'background:#fdb813;color:#000;font-weight:bold;padding:2px 6px;border-radius:3px 0 0 3px;',
      'background:#4fc3f7;color:#000;padding:2px 6px;border-radius:0 3px 3px 0;'
    );
  } catch (err) {
    console.error('[Boot] Critical error:', err);
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.innerHTML = `<p style="color:#ef5350;font-size:1rem;">Failed to initialise. ${err.message}</p>`;
    }
  }
}

// Wait for GSAP to load (deferred script), then boot
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    // Small delay to ensure GSAP is parsed
    requestAnimationFrame(boot);
  });
} else {
  requestAnimationFrame(boot);
}

</script>
